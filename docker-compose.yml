version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: maraba-hospital:latest
    container_name: maraba_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-https://marabahospital.onrender.com}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=maraba
      - DB_USERNAME=maraba
      - DB_PASSWORD=secret
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MAIL_* ${MAIL_*:-}
    volumes:
      # For development, you can mount local code to avoid rebuilds
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - db
      - redis
    networks:
      - maraba_net

  webserver:
    image: nginx:stable-alpine
    container_name: maraba_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./storage/logs/nginx:/var/log/nginx
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - maraba_net

  db:
    image: mysql:8.0
    container_name: maraba_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: maraba
      MYSQL_USER: maraba
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - maraba_net

  redis:
    image: redis:7-alpine
    container_name: maraba_redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - maraba_net

volumes:
  dbdata:
  redisdata:

networks:
  maraba_net:
    driver: bridge