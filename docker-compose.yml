version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: maraba-hospital:latest
    container_name: maraba_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8080}
      # SQLite Configuration
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/data/database.sqlite
      # File-based caching (no Redis needed)
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      # Mail config (optional)
      - MAIL_MAILER=${MAIL_MAILER:-log}
    volumes:
      # Mount local storage for logs and file cache
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      # Persistent SQLite volume
      - sqlite_data:/var/data
    networks:
      - maraba_net

  webserver:
    image: nginx:stable-alpine
    container_name: maraba_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./storage/logs/nginx:/var/log/nginx
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - maraba_net

volumes:
  sqlite_data:   # Persists your SQLite database across container restarts

networks:
  maraba_net:
    driver: bridge